<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Order — Cavite City Coffee Club</title>
<meta name="description" content="Order from your table. Pay at the counter.">
<meta name="theme-color" content="#B5432B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCCC">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/brand/tile-icon-192.png">
<link rel="apple-touch-icon" href="../shared/brand/tile-icon-192.png">
<!-- One small web font, from this site (no outside requests): Brunson for titles and the stamp card.
     font-display: swap, so text shows in the fallback font until it arrives. Body text is the phone's own font. -->
<link rel="preload" href="../shared/brand/brunson.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="../shared/brand/tokens.css">
<link rel="stylesheet" href="./order.css">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-logo" id="brand-logo"><img src="../shared/brand/tile-icon-192.webp" alt="" width="44" height="44" decoding="async"></span>
    <span class="brand-name" id="brand-name"><img class="brand-wordmark" src="../shared/brand/wordmark-terracotta.webp" alt="" width="95" height="40" decoding="async"><span class="sr-only">Cavite City Coffee Club</span></span>
  </div>
  <span class="table-tag" id="table-tag"></span>
</header>
<main id="main" class="main"><p class="loading">Opening the menu…</p></main>
<div id="bottom" class="bottom" hidden></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="../shared/config.js"></script>
<script src="../shared/cloud.js"></script>
<!-- Icons and the brand logo helpers (no other shared file needed). -->
<script src="../shared/ui.js"></script>
<!-- Optional "are you a person" check. Does nothing (loads nothing) while the site key in config.js is empty. -->
<script src="../shared/captcha.js"></script>
<script src="./order.js"></script>
</body>
</html>
