<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back Office — Cavite City Coffee Club</title>
<meta name="description" content="Back Office for the shop owner: stock, recipes and menu, costing, sales calendar, customers, tables and QR codes, staff PINs, counters and settings.">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F1B19">
<link rel="icon" type="image/png" href="../shared/brand/tile-icon-192.png">
<link rel="apple-touch-icon" href="../shared/brand/tile-icon-192.png">
<!-- No outside fonts: Brunson comes from ../shared/brand/tokens.css, body text uses the device's own font. -->
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="./back.css">
</head>
<body>
<div id="boot-screen" class="auth-screen">
  <div class="auth-card">
    <div class="pin-logo"><img class="brand-mark" src="../shared/brand/tile-icon-192.webp" alt="" width="72" height="72"></div>
    <p class="boot-msg text-light">Opening the Back Office…</p>
    <div class="boot-actions"></div>
  </div>
</div>

<div id="auth-screen" class="auth-screen" style="display:none;"></div>

<div id="app" style="display:none;">
  <div id="sidebar"></div>
  <div id="nav-scrim"></div>
  <div id="main">
    <div id="topbar">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open the menu"><svg class="cc-icon" aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="topbar-title">Dashboard</h1>
      <div class="actions" id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="toast-wrap" role="status" aria-live="polite"></div>

<script src="../shared/config.js"></script>
<script src="../shared/cloud.js"></script>
<script src="../shared/captcha.js"></script>
<script src="../shared/local.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/logic.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
<script src="./bo-core.js"></script>
<script src="./bo-stock.js"></script>
<script src="./bo-recipes.js"></script>
<script src="./bo-excel.js"></script>
<script src="./bo-sales.js"></script>
<script src="./bo-reports.js"></script>
<script src="./bo-admin.js"></script>
<script src="./bo-floor.js"></script>
<script src="./bo-import.js"></script>
</body>
</html>
